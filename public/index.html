<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Gestão de Clientes</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <img src="#" alt="Logo" />
        <h1>Gestão de Clientes</h1>
      </div>
      <div class="admin-button">
        <img src="#" alt="Logo" />
        <button>Administrador <span>⌄</span></button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-content">
          <h2>Carteira</h2>
          <nav class="sidebar-nav">
            <a href="#">Painel</a>
            <a href="#">Clientes</a>
            <a href="#">Propostas</a>
            <a href="#">Relatórios</a>
            <a href="#">Configurações</a>
          </nav>
        </div>

        <div class="conta-admin">
          <div class="conta-perfil"></div>
          <div class="sua-conta">
            <h2>Administrador</h2>
            <p>Sua conta</p>
          </div>
        </div>
      </aside>

      <main class="main">
        <div class="content-info">
          <div>
            <h2 id="title">Clientes</h2>
            <p id="subtitle">
              Cadastre, consulte, atualize e remova clientes em um só lugar.
            </p>
          </div>

          <div class="novo-cliente">
            <button>Exportar CSV</button>
            <button id="btn-novo">+ Novo cliente</button>
          </div>
        </div>
      </main>
    </div>

    <footer></footer>

    <script src="scripts/app.js"></script>
  </body>
</html>
